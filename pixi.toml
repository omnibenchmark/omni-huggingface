[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "omni-huggingface"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "python tests/test_run.py"
export-env = "pixi workspace export conda-environment --name omni-huggingface envs/omni-huggingface.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/omni-huggingface.yml"
export-env-scgpt = "pixi workspace export conda-environment -e scgpt --name omni-scgpt envs/omni-scgpt.yml  # NOTE: re-add the pip block by hand afterwards"

[dependencies]
python = ">=3.10"
huggingface_hub = "*"

# only the scgpt_metrics.py entrypoint needs a model runtime. scGPT itself is
# installed --no-deps: its metadata pins scvi-tools<1.0, orbax<0.1.8 and other
# 2023-era packages that the zero-shot embedding path never imports.
[feature.scgpt.dependencies]
pytorch-cpu = "*"
scanpy = "*"
anndata = "*"
scikit-learn = "*"
tqdm = "*"
pip = "*"
ipython = ">=9.15.0,<10"
datasets = ">=5.0.0,<6"

[feature.scgpt.tasks]
install-scgpt = "pip install --no-deps git+https://github.com/bowang-lab/scGPT@cebd6fae655b9c585a4807daa3ac31bb764f06b4"

[environments]
scgpt = ["scgpt"]
