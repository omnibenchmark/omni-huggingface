[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "omni-huggingface"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "python tests/test_run.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/omni-huggingface.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/omni-huggingface.yml"

[dependencies]
python = ">=3.10"
huggingface_hub = "*"
