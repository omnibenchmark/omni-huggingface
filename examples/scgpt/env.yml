# conda deps generated by `pixi run export-env-scgpt`; the pip block below is
# maintained by hand — scGPT must be installed --no-deps (its metadata pins
# scvi-tools<1.0, orbax<0.1.8 and other 2023-era packages that the zero-shot
# embedding path never imports), and pixi cannot express that.
name: omni-scgpt
channels:
- conda-forge
- nodefaults
dependencies:
- pytorch-cpu *
- scanpy *
- anndata *
- scikit-learn *
- tqdm *
- pip *
- ipython >=9.15.0,<10
- datasets >=5.0.0,<6
- python >=3.10
- huggingface_hub *
- pip:
  - --no-deps
  - git+https://github.com/bowang-lab/scGPT@cebd6fae655b9c585a4807daa3ac31bb764f06b4
