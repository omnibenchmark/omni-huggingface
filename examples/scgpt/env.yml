# conda deps generated by `pixi run export-env`; the pip block below is
# maintained by hand.
#
# scGPT must be installed WITHOUT its dependencies: its metadata pins
# scvi-tools<1.0, orbax<0.1.8 and other 2023-era packages that the zero-shot
# embedding path never imports and that no longer resolve. A conda env file
# cannot say --no-deps (conda hands the pip: list to pip as a requirements
# file, which rejects that option), so export it instead:
#
#     PIP_NO_DEPS=1 ob run benchmark examples/scgpt/benchmark.yaml
name: omni-scgpt
channels:
- conda-forge
- nodefaults
dependencies:
- pytorch-cpu *
- scanpy *
- anndata *
- scikit-learn *
- tqdm *
- pip *
- ipython >=9.15.0,<10
- datasets >=5.0.0,<6
- python >=3.10
- huggingface_hub *
- pip:
  - git+https://github.com/bowang-lab/scGPT@cebd6fae655b9c585a4807daa3ac31bb764f06b4
